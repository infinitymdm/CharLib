[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "charlib"
version = "2.2.0"
description = "An open-source standard cell library characterizer"
license = "GPL-2.0"
readme = "README.md"
authors = [
    {name = "Marcus Mellor", email = "marcus@infinitymdm.dev"},
    {name = "James Stine",   email = "james.stine@okstate.edu"},
]
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = [ "VLSI", "EDA"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiida-spice==0.2.0a0",
    "liberty-parser>=0.0.29",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pint>=0.25.3",
    "pyyaml>=6.0.3",
    "schema>=0.7.8",
]

[project.scripts]
charlib = "charlib.cli.main:main"

[project.optional-dependencies]
docs = [
    "Sphinx>=9.1.0",
    "jsonschema2rst>=0.1.7",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-mermaid>=2.0.2",
]
pre-commit = [
    "pre-commit>=4.6",
    "pre-commit-update>=0.9",
    "ruff>=0.13.2"
]
tests = [
    "pytest>=9.0",
    "coverage>=7.15",
]

[project.urls]
repository = "https://github.com/stineje/CharLib"
documentation = "https://stineje.github.io/CharLib/"

[tool.pytest.ini_options]
testpaths = [
    "test/syntax",
    "test/logic",
    "test/examples"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
]
select = [
    "E",    # pydocstyle
    "W",    # pydocstyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PLC",  # pylint-convention
    "PLE",  # pylint-error
    "PLR",  # pylint-refactor
    "PLW",  # pylint-warning
    "RUF",  # ruff
]
